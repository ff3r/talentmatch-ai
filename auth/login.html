<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | TalentMatch AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/pages/auth.css?v=2">
</head>

<body class="tm-auth-page">
  <div class="tm-auth-layout">

    <aside class="tm-auth-illustration">
      <div class="tm-auth-illustration__content">
        <img src="../assets/images/logo-white.png" alt="TalentMatch AI" class="tm-auth-logo">
        <h2 class="tm-auth-illustration__title">Encuentra el talento que tu empresa necesita</h2>
        <p class="tm-auth-illustration__text">Conectamos empresas con los mejores profesionales usando inteligencia
          artificial y matching inteligente.</p>
      </div>
    </aside>

    <main class="tm-auth-main">
      <div class="tm-auth-form-container">
        
        <a href="../index.html" class="tm-auth-back">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          Volver al inicio
        </a>

        <div class="tm-auth-header">

          <h1 class="tm-auth-header__title">Iniciar Sesión</h1>
          <p class="tm-auth-header__subtitle">Ingresa tus credenciales para acceder a tu cuenta</p>
        </div>

        <form id="loginForm" class="tm-form" novalidate>
          <div class="tm-form__group">
            <label for="email" class="tm-form__label">Correo electrónico</label>
            <input type="email" id="email" name="email" class="tm-form__input" placeholder="tu@correo.com"
              autocomplete="email" required>
            <span class="tm-form__error" id="emailError"></span>
          </div>

          <div class="tm-form__group">
            <label for="password" class="tm-form__label">Contraseña</label>
            <div class="tm-form__input-wrapper">
              <input type="password" id="password" name="password" class="tm-form__input" placeholder="••••••••"
                autocomplete="current-password" required>
              <button type="button" class="tm-form__toggle-password" aria-label="Mostrar contraseña">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
            <span class="tm-form__error" id="passwordError"></span>
          </div>

          <div class="tm-form__actions">
            <button type="submit" class="tm-btn tm-btn--primary tm-btn--block">
              Ingresar
            </button>
          </div>
        </form>

        <div class="tm-auth-footer">
          <p class="tm-auth-footer__text">¿No tienes una cuenta?</p>
          <div class="tm-auth-footer__links">
            <a href="registro-empresa.html" class="tm-auth-footer__link">Soy una Empresa</a>
            <span class="tm-auth-footer__separator">·</span>
            <a href="registro-postulante.html" class="tm-auth-footer__link">Soy un Candidato</a>
          </div>
        </div>
      </div>
    </main>

  </div>

  <script src="../js/auth.js" defer></script>
</body>

</html>
