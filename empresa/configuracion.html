<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuración | TalentMatch AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/pages/empresa.css">
</head>

<body class="tm-empresa-page">
  <div class="tm-dashboard-layout">
    <aside class="tm-sidebar">
      <div class="tm-sidebar__header">
        <img src="../assets/images/logo-black.png" alt="TalentMatch AI" class="tm-sidebar__logo">
      </div>
      <nav class="tm-sidebar__nav">
        <a href="dashboard.html" class="tm-sidebar__item">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" />
            <rect x="14" y="3" width="7" height="7" />
            <rect x="14" y="14" width="7" height="7" />
            <rect x="3" y="14" width="7" height="7" />
          </svg>
          <span class="tm-sidebar__label">Panel Principal</span>
        </a>
        <a href="ofertas.html" class="tm-sidebar__item">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2" />
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
          </svg>
          <span class="tm-sidebar__label">Mis Ofertas</span>
        </a>
        <a href="oferta-formulario.html" class="tm-sidebar__item">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
          <span class="tm-sidebar__label">Crear Oferta</span>
        </a>
        <a href="perfil.html" class="tm-sidebar__item">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          <span class="tm-sidebar__label">Perfil de Empresa</span>
        </a>
      </nav>
    </aside>

    <header class="tm-navbar">
      <div class="tm-navbar__left">
        <button class="tm-navbar__toggle" aria-label="Toggle sidebar">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>
        <h1 class="tm-navbar__title">Configuración</h1>
      </div>
      <div class="tm-navbar__right">
        <div class="tm-dropdown">
          <button class="tm-dropdown__toggle" id="profileDropdownBtn">
            <span class="tm-avatar tm-avatar--sm">TC</span>
            <span class="tm-navbar__username">TechCorp Internacional S.A.</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--color-neutral-500)"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
          
          <div class="tm-dropdown__menu" id="profileDropdownMenu">
            <div style="padding: var(--space-4); border-bottom: 1px solid var(--color-neutral-200);">
              <p style="font-weight: var(--font-weight-bold); color: var(--color-neutral-900);">TechCorp S.A.</p>
              <p style="font-size: var(--text-body-sm); color: var(--color-neutral-600);">empresa@talentmatch.com</p>
            </div>
            <div style="padding: var(--space-2);">
              <a href="perfil.html" class="tm-dropdown__item">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                Mi Perfil
              </a>
              <a href="configuracion.html" class="tm-dropdown__item">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                Configuración
              </a>
            </div>
            <div style="padding: var(--space-2); border-top: 1px solid var(--color-neutral-200);">
              <button onclick="AuthService.logout()" class="tm-dropdown__item tm-dropdown__item--danger">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                Cerrar Sesión
              </button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="tm-main tm-page-content">
      <div class="tm-empresa-dashboard">
        <section class="tm-empresa-dashboard__section">
          
          <div class="tm-grid tm-grid-2" style="gap: var(--space-6); align-items: start;">
            
            <!-- Tarjeta Seguridad -->
            <div class="tm-card" style="box-shadow: var(--shadow-sm); border: 1px solid var(--color-neutral-300);">
              <h2 class="tm-text-h3 tm-mb-4" style="color: var(--color-primary-700); border-bottom: 2px solid var(--color-primary-100); padding-bottom: var(--space-2);">Seguridad y Acceso</h2>
              <form class="tm-form" style="display: flex; flex-direction: column; gap: var(--space-4);">
                
                <div class="tm-form__group">
                  <label class="tm-form__label">Correo Electrónico Actual</label>
                  <input type="email" class="tm-form__input" value="empresa@talentmatch.com" disabled style="background-color: var(--color-neutral-100); cursor: not-allowed;">
                </div>

                <div class="tm-form__group">
                  <label class="tm-form__label">Contraseña Actual</label>
                  <input type="password" class="tm-form__input" placeholder="••••••••">
                </div>
                
                <div class="tm-form__group">
                  <label class="tm-form__label">Nueva Contraseña</label>
                  <input type="password" class="tm-form__input" placeholder="Mínimo 8 caracteres">
                </div>

                <div class="tm-form__group">
                  <label class="tm-form__label">Confirmar Nueva Contraseña</label>
                  <input type="password" class="tm-form__input" placeholder="Repite la nueva contraseña">
                </div>

                <div style="display: flex; justify-content: flex-end; margin-top: var(--space-2);">
                  <button type="button" class="tm-btn tm-btn--primary">Actualizar Contraseña</button>
                </div>
              </form>
            </div>

            <!-- Tarjeta Notificaciones y Preferencias -->
            <div style="display: flex; flex-direction: column; gap: var(--space-6);">
              
              <div class="tm-card" style="box-shadow: var(--shadow-sm); border: 1px solid var(--color-neutral-300);">
                <h2 class="tm-text-h3 tm-mb-4" style="color: var(--color-primary-700); border-bottom: 2px solid var(--color-primary-100); padding-bottom: var(--space-2);">Notificaciones</h2>
                
                <div style="display: flex; flex-direction: column; gap: var(--space-4);">
                  <label style="display: flex; align-items: center; gap: var(--space-3); cursor: pointer;">
                    <input type="checkbox" checked style="width: 18px; height: 18px; accent-color: var(--color-primary-600);">
                    <span class="tm-text-body-sm" style="color: var(--color-neutral-700);">Recibir email por cada nueva postulación</span>
                  </label>
                  
                  <label style="display: flex; align-items: center; gap: var(--space-3); cursor: pointer;">
                    <input type="checkbox" checked style="width: 18px; height: 18px; accent-color: var(--color-primary-600);">
                    <span class="tm-text-body-sm" style="color: var(--color-neutral-700);">Notificarme cuando un candidato haga match de +80%</span>
                  </label>

                  <label style="display: flex; align-items: center; gap: var(--space-3); cursor: pointer;">
                    <input type="checkbox" style="width: 18px; height: 18px; accent-color: var(--color-primary-600);">
                    <span class="tm-text-body-sm" style="color: var(--color-neutral-700);">Resumen semanal de desempeño de mis ofertas</span>
                  </label>

                  <div style="display: flex; justify-content: flex-end; margin-top: var(--space-2);">
                    <button type="button" class="tm-btn tm-btn--secondary tm-btn--sm">Guardar Preferencias</button>
                  </div>
                </div>
              </div>

              <div class="tm-card" style="box-shadow: var(--shadow-sm); border: 1px solid var(--color-neutral-300);">
                <h2 class="tm-text-h3 tm-mb-4" style="color: var(--color-primary-700); border-bottom: 2px solid var(--color-primary-100); padding-bottom: var(--space-2);">Facturación y Plan</h2>
                <div style="display: flex; align-items: center; justify-content: space-between;">
                  <div>
                    <p class="tm-text-body" style="font-weight: bold;">Plan Actual: <span class="tm-badge tm-badge--success">Premium Corporativo</span></p>
                    <p class="tm-text-body-sm" style="color: var(--color-neutral-500); margin-top: var(--space-1);">Renovación automática el 15 de Noviembre, 2026</p>
                  </div>
                  <button type="button" class="tm-btn tm-btn--ghost tm-btn--sm">Gestionar Pagos</button>
                </div>
              </div>

            </div>

          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="../js/auth.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Toggle Sidebar
      const toggleBtn = document.querySelector('.tm-navbar__toggle');
      const layout = document.querySelector('.tm-dashboard-layout');
      if (toggleBtn && layout) {
        toggleBtn.addEventListener('click', () => {
          layout.classList.toggle('tm-sidebar-collapsed');
        });
      }

      // Dropdown de perfil
      const dropdownBtn = document.getElementById('profileDropdownBtn');
      const dropdownMenu = document.getElementById('profileDropdownMenu');
      if (dropdownBtn && dropdownMenu) {
        dropdownBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          dropdownMenu.classList.toggle('is-active');
        });
        document.addEventListener('click', (e) => {
          if (!dropdownMenu.contains(e.target)) {
            dropdownMenu.classList.remove('is-active');
          }
        });
      }
    });
  </script>
</body>
</html>
