<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil de Empresa | TalentMatch AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/pages/empresa.css">
  <style>
    .tm-profile-grid {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: var(--space-6);
    }
    @media (max-width: 992px) {
      .tm-profile-grid {
        grid-template-columns: 1fr;
      }
    }
    .tm-profile-avatar-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: var(--space-4) 0;
    }
    .tm-profile-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background-color: var(--color-primary-50);
      color: var(--color-primary-700);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: var(--font-weight-bold);
      margin-bottom: var(--space-4);
      border: 4px solid white;
      box-shadow: var(--shadow-md);
    }
  </style>
</head>

<body class="tm-empresa-page">
  <div class="tm-dashboard-layout">
    <aside class="tm-sidebar">
      <div class="tm-sidebar__header">
        <img src="../assets/images/logo-black.png" alt="TalentMatch AI" class="tm-sidebar__logo">
      </div>
      <nav class="tm-sidebar__nav">
        <a href="dashboard.html" class="tm-sidebar__item">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" />
            <rect x="14" y="3" width="7" height="7" />
            <rect x="14" y="14" width="7" height="7" />
            <rect x="3" y="14" width="7" height="7" />
          </svg>
          <span class="tm-sidebar__label">Panel Principal</span>
        </a>
        <a href="ofertas.html" class="tm-sidebar__item">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2" />
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
          </svg>
          <span class="tm-sidebar__label">Mis Ofertas</span>
        </a>
        <a href="oferta-formulario.html" class="tm-sidebar__item">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
          <span class="tm-sidebar__label">Crear Oferta</span>
        </a>
        <a href="perfil.html" class="tm-sidebar__item tm-sidebar__item--active">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          <span class="tm-sidebar__label">Perfil de Empresa</span>
        </a>
      </nav>
    </aside>

    <header class="tm-navbar">
      <div class="tm-navbar__left">
        <button class="tm-navbar__toggle" aria-label="Toggle sidebar">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>
        <h1 class="tm-navbar__title">Perfil de Empresa</h1>
      </div>
      <div class="tm-navbar__right">
        <div class="tm-navbar__user">
          <span class="tm-avatar tm-avatar--sm">TC</span>
          <span class="tm-navbar__username">TechCorp Internacional S.A.</span>
        </div>
        <button class="tm-btn tm-btn--ghost tm-btn--sm" onclick="AuthService.logout()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
          Cerrar Sesión
        </button>
      </div>
    </header>

    <main class="tm-main tm-page-content">
      <div class="tm-empresa-dashboard">
        
        <div class="tm-profile-grid">
          
          <!-- Columna Izquierda: Logo y Branding -->
          <div class="tm-card" style="align-self: start;">
            <div class="tm-profile-avatar-wrapper">
              <div class="tm-profile-avatar">TC</div>
              <h3 class="tm-text-h4" style="color: var(--color-neutral-900);">TechCorp S.A.</h3>
              <p style="color: var(--color-neutral-600); margin-bottom: var(--space-6); font-size: var(--text-body-sm);">Tecnología y Software</p>
              
              <button class="tm-btn tm-btn--secondary" style="width: 100%; justify-content: center;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                Actualizar Logo
              </button>
            </div>
          </div>
          
          <!-- Columna Derecha: Formulario de Información -->
          <div class="tm-card">
            <h3 class="tm-text-h4" style="margin-bottom: var(--space-6); border-bottom: 1px solid var(--color-neutral-200); padding-bottom: var(--space-2); color: var(--color-primary-700);">Información Pública de la Empresa</h3>
            
            <form class="tm-modal__form" style="padding: 0; overflow: visible;">
              <div class="tm-modal__grid">
                
                <div class="tm-form__group tm-form__group--full">
                  <label class="tm-form__label">Razón Social</label>
                  <input type="text" class="tm-form__input" value="TechCorp Internacional S.A." required>
                </div>
                
                <div class="tm-form__group">
                  <label class="tm-form__label">Sector / Industria</label>
                  <select class="tm-form__input" required>
                    <option value="">Seleccionar sector</option>
                    <option value="tecnologia" selected>Tecnología y Software</option>
                    <option value="finanzas">Finanzas y Banca</option>
                    <option value="salud">Salud y Medicina</option>
                    <option value="educacion">Educación</option>
                    <option value="retail">Retail y Comercio</option>
                  </select>
                </div>
                
                <div class="tm-form__group">
                  <label class="tm-form__label">Tamaño de la Empresa</label>
                  <select class="tm-form__input" required>
                    <option value="">Seleccionar tamaño</option>
                    <option value="1-10">1 - 10 empleados</option>
                    <option value="11-50">11 - 50 empleados</option>
                    <option value="51-200" selected>51 - 200 empleados</option>
                    <option value="201-500">201 - 500 empleados</option>
                    <option value="500+">Más de 500 empleados</option>
                  </select>
                </div>
                
                <div class="tm-form__group">
                  <label class="tm-form__label">Sitio Web</label>
                  <input type="url" class="tm-form__input" value="https://techcorp.example.com">
                </div>
                
                <div class="tm-form__group">
                  <label class="tm-form__label">Ubicación de Sede Principal</label>
                  <input type="text" class="tm-form__input" value="Lima, Perú">
                </div>
                
                <div class="tm-form__group tm-form__group--full">
                  <label class="tm-form__label">Descripción de la Empresa</label>
                  <textarea class="tm-form__input" rows="5" required>TechCorp es una empresa líder en desarrollo de software y transformación digital. Nos enfocamos en crear soluciones innovadoras que impulsan el crecimiento de nuestros clientes a nivel global. Buscamos talento apasionado por la tecnología para unirse a nuestro equipo dinámico.</textarea>
                </div>
                
                <div class="tm-form__group tm-form__group--full">
                  <label class="tm-form__label">Enlaces de Redes Sociales</label>
                  <div style="display: flex; flex-direction: column; gap: var(--space-3);">
                    
                    <div style="display: flex; gap: var(--space-2); align-items: center;">
                      <input type="url" class="tm-form__input" value="https://linkedin.com/company/techcorp-intl" style="flex: 1;" placeholder="https://">
                      <button type="button" class="tm-btn tm-btn--ghost" style="padding: var(--space-2); color: var(--color-error-500);" aria-label="Eliminar enlace">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                      </button>
                    </div>
                    
                    <button type="button" class="tm-btn tm-btn--secondary tm-btn--sm" style="align-self: flex-start;">
                      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                      Añadir otra red social
                    </button>
                  </div>
                </div>
                
              </div>
              
              <div style="display: flex; justify-content: flex-end; margin-top: var(--space-8); padding-top: var(--space-4); border-top: 1px solid var(--color-neutral-200);">
                <button type="submit" class="tm-btn tm-btn--primary">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                  Guardar Cambios
                </button>
              </div>
            </form>
          </div>
          
        </div>

      </div>
    </main>
  </div>

  <script src="../js/auth.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.querySelector('.tm-navbar__toggle');
      const layout = document.querySelector('.tm-dashboard-layout');
      if (toggleBtn && layout) {
        toggleBtn.addEventListener('click', () => {
          layout.classList.toggle('tm-sidebar-collapsed');
        });
      }
    });
  </script>
</body>

</html>
